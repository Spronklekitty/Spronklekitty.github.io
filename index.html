<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spronklekitty Games</title>

<link href="https://fonts.googleapis.com/css2?family=Federo&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Federo', cursive;
    background:#0a2c73;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
}

/* =========================
   DIAGONAL STRIPES BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    top:-200%;
    left:-200%;
    width:400%;
    height:400%;
    background:repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.08) 0px,
        rgba(255,255,255,0.08) 40px,
        transparent 40px,
        transparent 80px
    );
    animation:scrollStripes 20s linear infinite;
    z-index:-1;
}

@keyframes scrollStripes{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(400px,400px);
    }
}

/* =========================
   GAME SECTION
========================= */

.game{
    width:90%;
    max-width:1000px;
    margin:80px auto;
}

.banner{
    position:relative;
    height:260px;
    background:url("https://picsum.photos/1200/400?blur=2") center/cover;
    overflow:hidden;
}

.banner::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:70%;
    background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
}

.play-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#2f6fff;
    border:none;
    width:100px;
    height:100px;
    border-radius:50%;
    color:white;
    font-size:32px;
    cursor:pointer;
    z-index:2;
    transition:transform .25s ease;
}

.play-btn:hover{
    transform:translate(-50%,-50%) scale(1.15);
}

.title{
    font-size:36px;
    margin-top:20px;
}

.spacer{
    margin:12px 0;
    font-size:15px;
    opacity:.85;
    line-height:1.6;
}

/* =========================
   FULLSCREEN FRAME
========================= */

.game-frame{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
    z-index:10;
}

.game-frame iframe{
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   IRIS EFFECT
========================= */

.iris{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:20;
    background:radial-gradient(circle at center,
        transparent 150%,
        black 151%);
    transition:background 1s ease-in-out;
    display:none;
}
</style>
</head>
<body>

<div class="game">
    <div class="banner">
        <button class="play-btn" onclick="launchGame()">▶</button>
    </div>
    <div class="title">Placeholder1</div>
    <div class="spacer">
        =================================<br>
        Lorem Ipsum -- game description goes here<br>
        =================================
    </div>
</div>

<!-- FULLSCREEN GITHUB FRAME -->
<div class="game-frame" id="gameFrame">
    <iframe id="siteFrame"></iframe>
</div>

<!-- IRIS OVERLAY -->
<div class="iris" id="iris"></div>

<script>
function launchGame(){

    const iris = document.getElementById("iris");
    const frame = document.getElementById("gameFrame");
    const site = document.getElementById("siteFrame");

    iris.style.display = "block";

    // Close iris
    setTimeout(()=>{
        iris.style.background =
            "radial-gradient(circle at center, transparent 0%, black 1%)";
    },10);

    // When fully black
    setTimeout(()=>{

        frame.style.display = "block";
        site.src = "https://github.com/Axolotleless";

        // Open iris again
        setTimeout(()=>{
            iris.style.background =
                "radial-gradient(circle at center, transparent 150%, black 151%)";

            setTimeout(()=>{
                iris.style.display = "none";
            },1000);

        },100);

    },1000);
}
</script>

</body>
</html>
