<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spronklekitty Games</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#1e90ff;
    color:white;
    overflow-x:hidden;
}

/* ===== DIAGONAL STRIPES ===== */

.stripes{
    position:fixed;
    width:300%;
    height:300%;
    top:-100%;
    left:-100%;
    background:
    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.08) 0px,
        rgba(255,255,255,0.08) 50px,
        transparent 50px,
        transparent 100px
    );
    animation:moveStripes 25s linear infinite;
    z-index:-1;
}

@keyframes moveStripes{
    from{ transform:translate(0,0); }
    to{ transform:translate(-600px,-600px); }
}

/* ===== MAIN LAYOUT ===== */

.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}

/* ===== LOGO ===== */

.logo{
    width:260px;
    margin-bottom:30px;
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-12px); }
}

/* ===== TITLE ===== */

h1{
    font-size:3.5rem;
    margin-bottom:40px;
    letter-spacing:2px;
}

/* ===== NAV LINKS ===== */

.nav{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.nav a{
    font-size:2rem;
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:0.2s;
    display:inline-block;
}

.nav a:hover{
    transform:rotate(-3deg) scale(1.1);
    color:#ffffff;
}

/* ===== SECTIONS ===== */

.section{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
}

/* ===== GAME LIST ===== */

.games{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.game{
    font-size:1.8rem;
    font-weight:bold;
    transition:0.2s;
}

.game:hover{
    transform:rotate(2deg) scale(1.05);
}

/* ===== CONTACT ===== */

.contact input,
.contact textarea{
    width:280px;
    padding:10px;
    margin-top:10px;
    border:none;
    font-size:1rem;
}

.contact button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    background:white;
    color:#1e90ff;
    font-weight:bold;
    cursor:pointer;
}

.contact button:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="stripes"></div>

<!-- HOME -->
<div class="wrapper" id="home">
    <img src="Untitled139_20260212061631.png" class="logo">
    <h1>Spronklekitty Games</h1>

    <div class="nav">
        <a href="#games">Games</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </div>
</div>

<!-- GAMES -->
<div class="section" id="games">
    <div>
        <h1>Our Games</h1>
        <div class="games">
            <div class="game">Roblox Game 1</div>
            <div class="game">Roblox Game 2</div>
            <div class="game">Roblox Game 3</div>
            <div class="game">Roblox Game 4</div>
        </div>
    </div>
</div>

<!-- ABOUT -->
<div class="section" id="about">
    <div>
        <h1>About Us</h1>
        <p style="max-width:500px;margin-top:20px;font-size:1.2rem;">
            We make fun and chaotic Roblox experiences.
            Spronklekitty Games is all about creativity and fun.
        </p>
    </div>
</div>

<!-- CONTACT -->
<div class="section contact" id="contact">
    <div>
        <h1>Contact</h1>
        <input type="text" placeholder="Your Name"><br>
        <input type="email" placeholder="Your Email"><br>
        <textarea rows="4" placeholder="Your Message"></textarea><br>
        <button>Send</button>
    </div>
</div>

</body>
</html>
