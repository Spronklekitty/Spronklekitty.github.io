<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spronklekitty Games</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#0a3d91,#1e90ff);
    color:white;
    overflow-x:hidden;
}

/* ===== Animated Diagonal Stripes ===== */

.stripes{
    position:fixed;
    width:300%;
    height:300%;
    top:-100%;
    left:-100%;
    background:
    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.06) 0px,
        rgba(255,255,255,0.06) 40px,
        transparent 40px,
        transparent 80px
    );
    animation:moveStripes 18s linear infinite;
    z-index:0;
}

@keyframes moveStripes{
    from{ transform:translate(0,0); }
    to{ transform:translate(-400px,-400px); }
}

/* ===== Section Base ===== */

section{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:100px 10%;
    position:relative;
    z-index:2;
}

.container{
    max-width:1200px;
    width:100%;
    opacity:0;
    transform:translateX(-80px);
    transition:all 1s cubic-bezier(.2,.8,.2,1);
}

.container.right{
    transform:translateX(80px);
}

.container.visible{
    opacity:1;
    transform:translateX(0);
}

/* ===== HERO ===== */

.hero{
    flex-direction:column;
    text-align:center;
}

.hero img{
    width:280px;
    max-width:80%;
    margin-bottom:25px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-15px); }
}

.hero h1{
    font-size:4rem;
    font-weight:800;
}

.hero p{
    margin-top:15px;
    font-size:1.3rem;
    opacity:0.9;
}

/* ===== GAMES SECTION ===== */

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    margin-top:40px;
}

.game-card{
    background:white;
    color:#0a3d91;
    padding:30px;
    border-radius:20px;
    font-weight:bold;
    font-size:1.2rem;
    transition:0.4s;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

.game-card:hover{
    transform:translateY(-10px) scale(1.03);
}

/* ===== CONTACT SECTION ===== */

.contact-box{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:25px;
    max-width:500px;
}

.contact-box input,
.contact-box textarea{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:white;
    color:#0a3d91;
}

.contact-box button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    background:white;
    color:#0a3d91;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.contact-box button:hover{
    transform:scale(1.05);
}

/* ===== Floating Buttons ===== */

.buttons{
    position:fixed;
    bottom:40px;
    right:40px;
    display:flex;
    gap:20px;
    z-index:5;
}

.icon-btn{
    width:65px;
    height:65px;
    background:rgba(255,255,255,0.9);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.icon-btn:hover{
    transform:scale(1.1) rotate(10deg);
}

.icon-btn img{
    width:30px;
}

/* ===== SETTINGS PANEL ===== */

.panel{
    position:fixed;
    top:0;
    right:-350px;
    width:300px;
    height:100%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    padding:40px;
    transition:0.5s;
    z-index:10;
}

.panel.open{
    right:0;
}
</style>
</head>
<body>

<div class="stripes"></div>

<!-- HERO -->
<section class="hero">
    <div class="container visible">
        <img src="Untitled139_20260212061631.png" alt="Logo">
        <h1>Spronklekitty Games</h1>
        <p>We build immersive Roblox experiences</p>
    </div>
</section>

<!-- GAMES -->
<section>
    <div class="container">
        <h2 style="font-size:3rem;">Our Games</h2>
        <div class="games-grid">
            <div class="game-card">Roblox Game 1</div>
            <div class="game-card">Roblox Game 2</div>
            <div class="game-card">Roblox Game 3</div>
            <div class="game-card">Roblox Game 4</div>
            <div class="game-card">Roblox Game 5</div>
            <div class="game-card">Roblox Game 6</div>
        </div>
    </div>
</section>

<!-- CONTACT -->
<section>
    <div class="container right">
        <h2 style="font-size:3rem;">Contact Us</h2>
        <div class="contact-box">
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea rows="4" placeholder="Your Message"></textarea>
            <button>Send Message</button>
        </div>
    </div>
</section>

<!-- FLOATING BUTTONS -->
<div class="buttons">
    <div class="icon-btn" onclick="togglePanel()">
        <img src="Untitled140_20260208003215.png">
    </div>
    <div class="icon-btn" onclick="document.querySelector('#contact').scrollIntoView()">
        <img src="Untitled140_20260209131253.png">
    </div>
</div>

<!-- SETTINGS PANEL -->
<div class="panel" id="panel">
    <h2>Settings</h2>
    <p>More features coming soon.</p>
</div>

<script>
function togglePanel(){
    document.getElementById("panel").classList.toggle("open");
}

/* ===== Scroll Reveal Animation ===== */

const containers = document.querySelectorAll(".container");

const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("visible");
        }
    });
},{
    threshold:0.2
});

containers.forEach(c=>{
    if(!c.classList.contains("visible")){
        observer.observe(c);
    }
});
</script>

</body>
    </html>
